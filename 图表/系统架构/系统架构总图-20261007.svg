<text x="280" y="1126" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#b46a20">模拟输出层独立于 FPGA 逻辑；本图是功能架构，具体引脚、电平和接线见硬件拓扑。</text>
<text x="40" y="1169" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#52677d">独立候选未接入主链：延迟 / 面板、T057 曲谱上传、T058 PCM 波形；T059 BLE / 安卓仍为计划。</text>
<text x="40" y="1195" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="400" fill="#52677d">SOURCE_MODE=1 固定音 / DIAG 是诊断分支；USB MIDI 采集不代表 FPGA 已实现 USB 主机。</text>
