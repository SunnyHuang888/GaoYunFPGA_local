<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<title>高云杯电子琴项目硬件连接拓扑图</title>
<desc>设备方框和彩色线区分 MIDI 信号、USB、音频、HDMI、供电及共地；不表示等比例物理布线。</desc>
<rect x="20" y="100" width="1560" height="830" rx="0" fill="#fdf0e4" stroke="#d3dfdf" stroke-width="2"/>
<text x="42" y="59" text-anchor="start" font-family="SimHei, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="32" fill="#224664">项目硬件连接拓扑图</text>
<text x="42" y="88" text-anchor="start" font-family="SimHei, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" fill="#5b7892">输入与接口层：MIDI 键盘、隔离模块、开发板、板载音频与显示；线色区分信号和供电。</text>
<rect x="70" y="195" width="365" height="135" rx="9" fill="#f8fbff" stroke="#96acc0" stroke-width="2"/>
<circle cx="117" cy="248" r="19" fill="none" stroke="#2867d7" stroke-width="3"/>
<text x="117" y="258" text-anchor="middle" font-family="SimHei, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" fill="#2867d7">键</text>
<text x="150" y="238" text-anchor="start" font-family="SimHei, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" fill="#224664">MIDIPLUS X4 III</text>
<text x="150" y="269" text-anchor="start" font-family="SimHei, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" fill="#224664">49 键 / DIN MIDI OUT</text>
<text x="150" y="299" text-anchor="start" font-family="SimHei, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" fill="#66809a">USB 供电 / 开发期采集</text>
<rect x="70" y="405" width="365" height="200" rx="9" fill="#fff9f2" stroke="#d9a782" stroke-width="2"/>
<circle cx="117" cy="460" r="19" fill="none" stroke="#dc713c" stroke-width="3"/>
<text x="117" y="470" text-anchor="middle" font-family="SimHei, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" fill="#dc713c">M</text>
<text x="150" y="446" text-anchor="start" font-family="SimHei, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" fill="#224664">M5Stack Unit MIDI (U187)</text>
<text x="150" y="483" text-anchor="start" font-family="SimHei, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" fill="#224664">DIN INPUT → 光耦隔离 / 整形</text>
<text x="95" y="536" text-anchor="start" font-family="SimHei, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" fill="#dc713c">Grove 白线：UART_TX / 3.3 V</text>
<text x="95" y="569" text-anchor="start" font-family="SimHei, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" fill="#dc313e">红线 5 V；黑线 GND</text>
<text x="95" y="597" text-anchor="start" font-family="SimHei, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" fill="#66809a">黄色 UART_RX：不接</text>
<rect x="70" y="735" width="365" height="145" rx="9" fill="#fff7f6" stroke="#dc9090" stroke-width="2"/>
<circle cx="117" cy="791" r="19" fill="none" stroke="#dc313e" stroke-width="3"/>
<text x="117" y="801" text-anchor="middle" font-family="SimHei, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" fill="#dc313e">电</text>
<text x="150" y="775" text-anchor="start" font-family="SimHei, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" fill="#224664">供电配置</text>
<text x="150" y="808" text-anchor="start" font-family="SimHei, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" fill="#dc313e">U187：独立稳定 5 V</text>
<text x="150" y="837" text-anchor="start" font-family="SimHei, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" fill="#224664">底板：双 USB 5 V / 12 V DC</text>
<text x="150" y="866" text-anchor="start" font-family="SimHei, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" fill="#224664">或 ≥3.6 V 锂电；详见文档</text>
<rect x="545" y="185" width="540" height="670" rx="6" fill="#91cad8" stroke="#3a8297" stroke-width="3"/>
<rect x="585" y="215" width="460" height="608" rx="3" fill="#b9e1e8" stroke="#84b8c7" stroke-width="2"/>
<text x="815" y="262" text-anchor="middle" font-family="SimHei, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="27" fill="#224664">Tang Mega 60K + NEO Dock</text>
<text x="815" y="297" text-anchor="middle" font-family="SimHei, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" fill="#224664">GW5AT-LV60 / 实时硬件音频</text>
<rect x="615" y="331" width="400" height="172" rx="9" fill="#d9eef1" stroke="#7db0be" stroke-width="2"/>
<text x="815" y="375" text-anchor="middle" font-family="SimHei, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" fill="#224664">FPGA 事件处理与四声部合成</text>
<text x="815" y="411" text-anchor="middle" font-family="SimHei, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" fill="#224664">输入：R17 / 50 MHz 时钟 / 按键</text>
<text x="815" y="445" text-anchor="middle" font-family="SimHei, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" fill="#224664">输出：PCM / 状态 UART / 显示候选</text>
<rect x="615" y="585" width="400" height="60" rx="9" fill="#edf9fb" stroke="#8cb9c3" stroke-width="2"/>
<text x="815" y="621" text-anchor="middle" font-family="SimHei, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" fill="#224664">PT8211-S  DAC / 16 bit LSBJ</text>
<rect x="615" y="692" width="400" height="60" rx="9" fill="#edf9fb" stroke="#8cb9c3" stroke-width="2"/>
<text x="815" y="728" text-anchor="middle" font-family="SimHei, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" fill="#224664">NS4263 功放 / 耳机 / 扬声器接口</text>
<polyline points="815,503 815,585" fill="none" stroke="#2867d7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="815,585 809.5,574.4 820.5,574.4" fill="#2867d7"/>
